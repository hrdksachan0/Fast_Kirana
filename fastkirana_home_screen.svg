<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" style="background-color: #F8F9FA; font-family: 'Inter', system-ui, -apple-system, sans-serif;">
  <!-- Definitions for Gradients & Shadows -->
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F9347" />
      <stop offset="100%" stop-color="#0B6B34" />
    </linearGradient>
    <linearGradient id="bannerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6B00" />
      <stop offset="100%" stop-color="#FF8E00" />
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.06" />
    </filter>
    <filter id="glowShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F9347" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="390" height="844" fill="#F8F9FA"/>

  <!-- Top Bar / Header -->
  <g id="Header">
    <rect width="390" height="150" fill="url(#primaryGrad)" rx="0"/>
    <path d="M0,130 Q195,155 390,130 L390,150 L0,150 Z" fill="#F8F9FA"/>

    <!-- Delivery Address Badge -->
    <g transform="translate(16, 44)">
      <rect width="180" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.2"/>
      <text x="12" y="18" fill="#FFFFFF" font-size="12" font-weight="700">⚡ 10 MINS TO</text>
      <text x="96" y="18" fill="#FFFFFF" font-size="12" font-weight="400">Green Park...</text>
    </g>

    <!-- Notification & Profile Icons -->
    <g transform="translate(340, 44)">
      <circle cx="16" cy="14" r="16" fill="#FFFFFF" fill-opacity="0.2"/>
      <text x="10" y="20" fill="#FFFFFF" font-size="14">🔔</text>
    </g>

    <!-- Search Bar -->
    <g transform="translate(16, 84)">
      <rect width="358" height="46" rx="14" fill="#FFFFFF" filter="url(#cardShadow)"/>
      <text x="16" y="28" fill="#9E9E9E" font-size="14">🔍 Search 5000+ groceries &amp; essentials...</text>
      <text x="320" y="28" fill="#0F9347" font-size="16">🎙️</text>
    </g>
  </g>

  <!-- Categories Grid -->
  <g id="Categories" transform="translate(16, 160)">
    <text x="0" y="16" fill="#1A1D1E" font-size="16" font-weight="800">Categories</text>
    <text x="310" y="16" fill="#0F9347" font-size="13" font-weight="700">SEE ALL</text>

    <!-- Category Items -->
    <!-- Item 1: Veggies -->
    <g transform="translate(0, 30)">
      <rect width="76" height="76" rx="16" fill="#E8F5E9"/>
      <text x="24" y="44" font-size="30">🥦</text>
      <text x="38" y="92" text-anchor="middle" fill="#212121" font-size="11" font-weight="600">Veggies</text>
    </g>

    <!-- Item 2: Milk & Dairy -->
    <g transform="translate(94, 30)">
      <rect width="76" height="76" rx="16" fill="#E3F2FD"/>
      <text x="24" y="44" font-size="30">🥛</text>
      <text x="38" y="92" text-anchor="middle" fill="#212121" font-size="11" font-weight="600">Milk &amp; Dairy</text>
    </g>

    <!-- Item 3: Snacks -->
    <g transform="translate(188, 30)">
      <rect width="76" height="76" rx="16" fill="#FFF3E0"/>
      <text x="24" y="44" font-size="30">🍟</text>
      <text x="38" y="92" text-anchor="middle" fill="#212121" font-size="11" font-weight="600">Snacks</text>
    </g>

    <!-- Item 4: Instant Food -->
    <g transform="translate(282, 30)">
      <rect width="76" height="76" rx="16" fill="#F3E5F5"/>
      <text x="24" y="44" font-size="30">🍜</text>
      <text x="38" y="92" text-anchor="middle" fill="#212121" font-size="11" font-weight="600">Instant</text>
    </g>
  </g>

  <!-- Banner Slider -->
  <g id="PromoBanner" transform="translate(16, 285)">
    <rect width="358" height="110" rx="18" fill="url(#bannerGrad)"/>
    <text x="20" y="36" fill="#FFFFFF" font-size="20" font-weight="900">FLASH SALE ⚡</text>
    <text x="20" y="58" fill="#FFFFFF" fill-opacity="0.9" font-size="13" font-weight="600">Get up to 40% OFF on Fresh Fruits</text>
    <rect x="20" y="70" width="100" height="26" rx="13" fill="#FFFFFF"/>
    <text x="32" y="87" fill="#FF6B00" font-size="11" font-weight="800">SHOP NOW →</text>
    <text x="260" y="80" font-size="60">🍎</text>
  </g>

  <!-- Product Section: Top Picks -->
  <g id="TopPicks" transform="translate(16, 420)">
    <text x="0" y="16" fill="#1A1D1E" font-size="16" font-weight="800">Top Picks For You</text>

    <!-- Product Card 1 -->
    <g transform="translate(0, 30)" filter="url(#cardShadow)">
      <rect width="168" height="230" rx="16" fill="#FFFFFF"/>
      <rect x="8" y="8" width="152" height="110" rx="12" fill="#F5F5F5"/>
      <text x="56" y="75" font-size="48">🥛</text>
      <rect x="12" y="14" width="54" height="20" rx="6" fill="#0F9347"/>
      <text x="18" y="28" fill="#FFFFFF" font-size="10" font-weight="800">15% OFF</text>
      <text x="12" y="138" fill="#212121" font-size="13" font-weight="700">Amul Taaza Milk</text>
      <text x="12" y="154" fill="#757575" font-size="11">1 Litre Pouch</text>
      <text x="12" y="178" fill="#1A1D1E" font-size="15" font-weight="800">₹28</text>
      <text x="46" y="178" fill="#9E9E9E" font-size="11" text-decoration="line-through">₹33</text>
      <!-- Add Button -->
      <g transform="translate(100, 185)">
        <rect width="60" height="32" rx="8" fill="#FFFFFF" stroke="#0F9347" stroke-width="1.5"/>
        <text x="30" y="20" text-anchor="middle" fill="#0F9347" font-size="12" font-weight="800">ADD</text>
      </g>
    </g>

    <!-- Product Card 2 -->
    <g transform="translate(190, 30)" filter="url(#cardShadow)">
      <rect width="168" height="230" rx="16" fill="#FFFFFF"/>
      <rect x="8" y="8" width="152" height="110" rx="12" fill="#F5F5F5"/>
      <text x="56" y="75" font-size="48">🍅</text>
      <rect x="12" y="14" width="54" height="20" rx="6" fill="#0F9347"/>
      <text x="18" y="28" fill="#FFFFFF" font-size="10" font-weight="800">20% OFF</text>
      <text x="12" y="138" fill="#212121" font-size="13" font-weight="700">Fresh Tomatoes</text>
      <text x="12" y="154" fill="#757575" font-size="11">500 g Pack</text>
      <text x="12" y="178" fill="#1A1D1E" font-size="15" font-weight="800">₹32</text>
      <text x="46" y="178" fill="#9E9E9E" font-size="11" text-decoration="line-through">₹40</text>
      <!-- Add Button Active -->
      <g transform="translate(90, 185)">
        <rect width="70" height="32" rx="8" fill="#0F9347"/>
        <text x="12" y="20" fill="#FFFFFF" font-size="14" font-weight="700">-</text>
        <text x="35" y="20" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="800">2</text>
        <text x="58" y="20" fill="#FFFFFF" font-size="14" font-weight="700">+</text>
      </g>
    </g>
  </g>

  <!-- Bottom Navigation Bar -->
  <g id="BottomNav" transform="translate(0, 764)">
    <rect width="390" height="80" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <line x1="0" y1="0" x2="390" y2="0" stroke="#EEEEEE" stroke-width="1"/>

    <!-- Nav Item 1: Home (Active) -->
    <g transform="translate(39, 14)">
      <text x="0" y="20" font-size="20">🏠</text>
      <text x="10" y="38" text-anchor="middle" fill="#0F9347" font-size="10" font-weight="800">Home</text>
    </g>

    <!-- Nav Item 2: Categories -->
    <g transform="translate(117, 14)">
      <text x="0" y="20" font-size="20">🗂️</text>
      <text x="10" y="38" text-anchor="middle" fill="#757575" font-size="10" font-weight="600">Categories</text>
    </g>

    <!-- Nav Item 3: Cart -->
    <g transform="translate(195, 14)">
      <text x="0" y="20" font-size="20">🛒</text>
      <circle cx="16" cy="4" r="7" fill="#FF3D00"/>
      <text x="16" y="7" text-anchor="middle" fill="#FFFFFF" font-size="9" font-weight="800">2</text>
      <text x="10" y="38" text-anchor="middle" fill="#757575" font-size="10" font-weight="600">Cart</text>
    </g>

    <!-- Nav Item 4: Orders -->
    <g transform="translate(273, 14)">
      <text x="0" y="20" font-size="20">📦</text>
      <text x="10" y="38" text-anchor="middle" fill="#757575" font-size="10" font-weight="600">Orders</text>
    </g>

    <!-- Nav Item 5: Profile -->
    <g transform="translate(335, 14)">
      <text x="0" y="20" font-size="20">👤</text>
      <text x="10" y="38" text-anchor="middle" fill="#757575" font-size="10" font-weight="600">Profile</text>
    </g>
  </g>
</svg>
