<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="cucGrad" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="45%" stop-color="#15803D"/>
      <stop offset="100%" stop-color="#14532D"/>
    </linearGradient>
    <radialGradient id="sliceGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#DCFCE7"/>
      <stop offset="78%" stop-color="#86EFAC"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </radialGradient>
    <filter id="cucShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#14532D" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Main Cucumber Body -->
  <path d="M22 84 C15 72 26 40 48 26 C72 12 98 18 106 32 C114 46 95 72 74 86 C50 102 30 96 22 84 Z" fill="url(#cucGrad)" filter="url(#cucShadow)"/>
  <!-- Ridges & Bumps -->
  <ellipse cx="62" cy="50" rx="3" ry="1.5" transform="rotate(-30 62 50)" fill="#86EFAC" opacity="0.4"/>
  <ellipse cx="46" cy="62" rx="2.5" ry="1.5" transform="rotate(-30 46 62)" fill="#86EFAC" opacity="0.4"/>
  <ellipse cx="80" cy="38" rx="2.5" ry="1.5" transform="rotate(-30 80 38)" fill="#86EFAC" opacity="0.4"/>
  <!-- Highlight Stripe -->
  <path d="M38 68 C50 48 76 34 94 30" stroke="#86EFAC" stroke-width="3" stroke-linecap="round" opacity="0.45"/>
  <!-- Cut Cucumber Slice in Foreground -->
  <g transform="translate(18, 52)">
    <circle cx="28" cy="28" r="24" fill="url(#sliceGrad)" stroke="#15803D" stroke-width="4"/>
    <!-- Center Seeds -->
    <ellipse cx="28" cy="28" rx="14" ry="14" fill="#BBF7D0" opacity="0.7"/>
    <ellipse cx="28" cy="22" rx="2" ry="4" fill="#15803D" opacity="0.6"/>
    <ellipse cx="28" cy="34" rx="2" ry="4" fill="#15803D" opacity="0.6"/>
    <ellipse cx="22" cy="28" rx="4" ry="2" fill="#15803D" opacity="0.6"/>
    <ellipse cx="34" cy="28" rx="4" ry="2" fill="#15803D" opacity="0.6"/>
  </g>
</svg>