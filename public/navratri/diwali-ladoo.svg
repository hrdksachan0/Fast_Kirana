<svg xmlns="http://www.w3.org/2000/svg" width="320" height="200" viewBox="0 0 320 200" fill="none">
  <defs>
    <filter id="sweetsShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#3A1700" flood-opacity="0.25"/>
    </filter>

    <!-- Royal Silver & Gold Plate Gradients -->
    <linearGradient id="thaliRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8E7"/>
      <stop offset="30%" stop-color="#FFD666"/>
      <stop offset="65%" stop-color="#D48806"/>
      <stop offset="100%" stop-color="#874D00"/>
    </linearGradient>

    <radialGradient id="thaliBase" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFDF5"/>
      <stop offset="50%" stop-color="#FFF1C2"/>
      <stop offset="85%" stop-color="#F3BA42"/>
      <stop offset="100%" stop-color="#A56200"/>
    </radialGradient>

    <!-- Juicy Golden Motichoor Ladoo Radial Gradients -->
    <radialGradient id="ladooGold1" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#FFF3A8"/>
      <stop offset="35%" stop-color="#FFB300"/>
      <stop offset="75%" stop-color="#FF8F00"/>
      <stop offset="100%" stop-color="#C44B00"/>
    </radialGradient>

    <radialGradient id="ladooGold2" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFF9C4"/>
      <stop offset="40%" stop-color="#FFA000"/>
      <stop offset="80%" stop-color="#E65100"/>
      <stop offset="100%" stop-color="#BF360C"/>
    </radialGradient>

    <!-- Silver Vark (Chandi Foil) Gradient -->
    <linearGradient id="chandiVark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#E2E8F0"/>
      <stop offset="80%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <!-- Kaju Katli Diamond Gradients -->
    <linearGradient id="kajuBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF7"/>
      <stop offset="60%" stop-color="#F5E6CC"/>
      <stop offset="100%" stop-color="#D6B88D"/>
    </linearGradient>
  </defs>

  <!-- Ground Ambient Shadow -->
  <ellipse cx="160" cy="174" rx="100" ry="14" fill="#3A1700" opacity="0.22"/>

  <!-- Ornate Carved Royal Thali / Platter -->
  <g filter="url(#sweetsShadow)">
    <!-- Base Plate Rim -->
    <ellipse cx="160" cy="154" rx="120" ry="30" fill="url(#thaliRim)"/>
    <!-- Plate Inner Base -->
    <ellipse cx="160" cy="152" rx="112" ry="25" fill="url(#thaliBase)"/>

    <!-- Decorative Carved Beading around Rim -->
    <ellipse cx="160" cy="153" rx="116" ry="27" stroke="#FFE58F" stroke-width="1.8" stroke-dasharray="2.5 5.5" fill="none"/>
  </g>

  <!-- Diamond-Cut Kaju Katli Pieces Arranged on Left & Right -->
  <g filter="url(#sweetsShadow)">
    <!-- Left Kaju Katli with Silver Vark Foil -->
    <polygon points="76,140 102,126 128,140 102,154" fill="url(#kajuBase)"/>
    <!-- Silver Foil Leaf Shimmer on Kaju Katli -->
    <polygon points="86,137 104,128 116,139 96,146" fill="url(#chandiVark)" opacity="0.85"/>

    <!-- Left Front Kaju Katli Piece -->
    <polygon points="98,146 120,134 142,146 120,158" fill="url(#kajuBase)"/>
    <polygon points="106,144 122,136 132,145 116,152" fill="url(#chandiVark)" opacity="0.9"/>

    <!-- Right Kaju Katli Piece -->
    <polygon points="192,146 216,134 240,146 216,158" fill="url(#kajuBase)"/>
    <polygon points="202,143 218,136 230,145 214,151" fill="url(#chandiVark)" opacity="0.85"/>
  </g>

  <!-- Pyramid Stack of Golden Motichoor & Besan Laddoos -->
  <g filter="url(#sweetsShadow)">
    <!-- Bottom Row Laddoos (4 Laddoos) -->
    <!-- L1 -->
    <circle cx="120" cy="126" r="23" fill="url(#ladooGold1)"/>
    <!-- L2 -->
    <circle cx="156" cy="126" r="24" fill="url(#ladooGold2)"/>
    <!-- L3 -->
    <circle cx="192" cy="127" r="23" fill="url(#ladooGold1)"/>

    <!-- Mid Row Laddoos (2 Laddoos) -->
    <circle cx="138" cy="95" r="24" fill="url(#ladooGold2)"/>
    <circle cx="178" cy="95" r="24" fill="url(#ladooGold1)"/>

    <!-- Top Crown Ladoo (1 Majestic Central Ladoo) -->
    <circle cx="158" cy="64" r="25" fill="url(#ladooGold2)"/>

    <!-- Textured Boondi Pearls & Pistachio / Almond Flecks on Laddoos -->
    <!-- Boondi Pearls Texture -->
    <g fill="#FFE082" opacity="0.9">
      <!-- Top Ladoo Texture -->
      <circle cx="150" cy="54" r="2.8"/>
      <circle cx="164" cy="52" r="2.5"/>
      <circle cx="156" cy="62" r="3.2"/>
      <circle cx="170" cy="62" r="2.4"/>
      <circle cx="146" cy="66" r="2.2"/>
      <circle cx="160" cy="74" r="2.6"/>

      <!-- Mid Left Ladoo Texture -->
      <circle cx="130" cy="88" r="2.5"/>
      <circle cx="142" cy="94" r="2.8"/>
      <circle cx="132" cy="102" r="2.2"/>

      <!-- Mid Right Ladoo Texture -->
      <circle cx="172" cy="88" r="2.5"/>
      <circle cx="184" cy="92" r="2.8"/>
      <circle cx="174" cy="102" r="2.2"/>
      
      <!-- Bottom Laddoos Texture -->
      <circle cx="114" cy="122" r="2.4"/>
      <circle cx="126" cy="128" r="2.5"/>
      <circle cx="150" cy="122" r="2.6"/>
      <circle cx="162" cy="124" r="2.8"/>
      <circle cx="186" cy="122" r="2.5"/>
      <circle cx="198" cy="126" r="2.4"/>
    </g>

    <!-- Real Silver Vark (Chandi Foil Glints) on Crown Ladoo -->
    <path d="M152 48Q160 46 166 52Q160 56 154 54Z" fill="url(#chandiVark)" opacity="0.95"/>
    <path d="M134 86Q140 84 144 89Q138 92 135 90Z" fill="url(#chandiVark)" opacity="0.9"/>
    <path d="M174 86Q180 84 184 88Q178 92 175 90Z" fill="url(#chandiVark)" opacity="0.9"/>

    <!-- Crushed Emerald Pistachio (Pista) Flecks -->
    <g fill="#4ADE80">
      <ellipse cx="154" cy="58" rx="2.2" ry="1.2" transform="rotate(-25 154 58)"/>
      <ellipse cx="166" cy="68" rx="2.4" ry="1.3" transform="rotate(35 166 68)"/>
      <ellipse cx="136" cy="98" rx="2" ry="1.2" transform="rotate(40 136 98)"/>
      <ellipse cx="180" cy="98" rx="2" ry="1.2" transform="rotate(-30 180 98)"/>
      <ellipse cx="158" cy="126" rx="2.2" ry="1.3" transform="rotate(15 158 126)"/>
    </g>

    <!-- Saffron Strands (Kesar) -->
    <g stroke="#DC2626" stroke-width="1.2" stroke-linecap="round">
      <path d="M148 50C150 53 147 56 149 58"/>
      <path d="M162 56C164 59 166 61 163 64"/>
      <path d="M142 92C144 95 143 97 141 99"/>
      <path d="M174 92C176 95 178 97 175 99"/>
    </g>
  </g>

  <!-- Festive Golden Sparkles -->
  <g fill="#FFFDF0">
    <path d="M54 60L56 54L58 60L64 62L58 64L56 70L54 64L48 62Z"/>
    <path d="M266 58L268 52L270 58L276 60L270 62L268 68L266 62L260 60Z"/>
    <path d="M218 36L219.5 31L221 36L226 37.5L221 39L219.5 44L218 39L213 37.5Z"/>
    <circle cx="68" cy="100" r="1.8" fill="#FFE082"/>
    <circle cx="254" cy="96" r="2" fill="#FFE082"/>
  </g>
</svg>
