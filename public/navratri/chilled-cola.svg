<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="colaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#180506"/>
      <stop offset="35%" stop-color="#5B0E14"/>
      <stop offset="70%" stop-color="#35060A"/>
      <stop offset="100%" stop-color="#120304"/>
    </linearGradient>
    <linearGradient id="glassSheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="colaDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Fizz Bubbles Rising -->
  <circle cx="54" cy="20" r="3" fill="#EF4444" opacity="0.6"/>
  <circle cx="68" cy="14" r="2.5" fill="#EF4444" opacity="0.7"/>
  <circle cx="48" cy="12" r="2" fill="#EF4444" opacity="0.5"/>
  <!-- Glass Cup Silhouette -->
  <g filter="url(#colaDrop)">
    <!-- Liquid Body -->
    <path d="M36 34 L44 104 C44 107 48 110 60 110 C72 110 76 107 76 104 L84 34 Z" fill="url(#colaGrad)"/>
    <!-- Ice Cubes inside liquid -->
    <rect x="44" y="38" width="16" height="16" rx="3" transform="rotate(15 44 38)" fill="#FFFFFF" fill-opacity="0.3" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1.5"/>
    <rect x="60" y="44" width="14" height="14" rx="3" transform="rotate(-12 60 44)" fill="#FFFFFF" fill-opacity="0.25" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1.5"/>
    <!-- Glass Wall Sheen -->
    <path d="M38 34 L45 104" stroke="url(#glassSheen)" stroke-width="3" stroke-linecap="round"/>
    <path d="M42 34 L48 98" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.4" stroke-linecap="round"/>
    <!-- Rim -->
    <ellipse cx="60" cy="34" rx="24" ry="5" fill="#35060A" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="1.5"/>
    <!-- Straw -->
    <path d="M72 14 L62 50 L60 85" stroke="#DC2626" stroke-width="4" stroke-linecap="round"/>
    <path d="M70 14 L73 14" stroke="#FFFFFF" stroke-width="4"/>
  </g>
  <!-- Condensation droplets -->
  <circle cx="46" cy="68" r="1.5" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="74" cy="74" r="1.5" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="58" cy="88" r="1.5" fill="#FFFFFF" opacity="0.8"/>
</svg>