<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" style="background-color: #F8F9FA; font-family: 'Inter', system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F9347" />
      <stop offset="100%" stop-color="#0B6B34" />
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect width="390" height="844" fill="#F8F9FA"/>

  <!-- Top Bar -->
  <g id="Header" transform="translate(16, 44)">
    <circle cx="18" cy="18" r="18" fill="#EEEEEE"/>
    <text x="12" y="24" fill="#212121" font-size="16" font-weight="700">←</text>
    <text x="50" y="24" fill="#1A1D1E" font-size="18" font-weight="800">Checkout</text>
  </g>

  <!-- Address Selection Card -->
  <g id="AddressCard" transform="translate(16, 100)" filter="url(#cardShadow)">
    <rect width="358" height="110" rx="16" fill="#FFFFFF"/>
    <rect x="16" y="16" width="36" height="36" rx="10" fill="#E8F5E9"/>
    <text x="24" y="40" font-size="20">🏠</text>
    <text x="64" y="32" fill="#1A1D1E" font-size="15" font-weight="800">Delivering to Home</text>
    <rect x="220" y="16" width="60" height="22" rx="6" fill="#E8F5E9"/>
    <text x="228" y="31" fill="#0F9347" font-size="10" font-weight="800">⚡ 10 MINS</text>
    <text x="64" y="52" fill="#757575" font-size="12">Flat B-402, Green Park Apartments, Sector 12</text>
    <line x1="16" y1="72" x2="342" y2="72" stroke="#F0F0F0" stroke-width="1"/>
    <text x="16" y="94" fill="#0F9347" font-size="12" font-weight="700">CHANGE ADDRESS →</text>
  </g>

  <!-- Order Items Card -->
  <g id="OrderItems" transform="translate(16, 230)" filter="url(#cardShadow)">
    <rect width="358" height="180" rx="16" fill="#FFFFFF"/>
    <text x="16" y="30" fill="#1A1D1E" font-size="15" font-weight="800">Items in Cart (2)</text>

    <!-- Item 1 -->
    <g transform="translate(16, 45)">
      <rect width="44" height="44" rx="8" fill="#F5F5F5"/>
      <text x="10" y="32" font-size="24">🥛</text>
      <text x="56" y="20" fill="#212121" font-size="13" font-weight="700">Amul Taaza Milk</text>
      <text x="56" y="36" fill="#757575" font-size="11">1 Litre • ₹28</text>
      <text x="300" y="28" fill="#1A1D1E" font-size="14" font-weight="800">₹28</text>
    </g>

    <line x1="16" y1="105" x2="342" y2="105" stroke="#F0F0F0" stroke-width="1"/>

    <!-- Item 2 -->
    <g transform="translate(16, 120)">
      <rect width="44" height="44" rx="8" fill="#F5F5F5"/>
      <text x="10" y="32" font-size="24">🍅</text>
      <text x="56" y="20" fill="#212121" font-size="13" font-weight="700">Fresh Farm Tomatoes</text>
      <text x="56" y="36" fill="#757575" font-size="11">500g • ₹32 x 2</text>
      <text x="300" y="28" fill="#1A1D1E" font-size="14" font-weight="800">₹64</text>
    </g>
  </g>

  <!-- Bill Summary Card -->
  <g id="BillSummary" transform="translate(16, 430)" filter="url(#cardShadow)">
    <rect width="358" height="170" rx="16" fill="#FFFFFF"/>
    <text x="16" y="30" fill="#1A1D1E" font-size="15" font-weight="800">Bill Details</text>
    
    <text x="16" y="60" fill="#757575" font-size="13">Item Total</text>
    <text x="310" y="60" fill="#212121" font-size="13" font-weight="700">₹92</text>

    <text x="16" y="85" fill="#757575" font-size="13">Delivery Fee (10 Mins)</text>
    <text x="300" y="85" fill="#0F9347" font-size="13" font-weight="700">FREE</text>

    <text x="16" y="110" fill="#757575" font-size="13">Handling Charge</text>
    <text x="320" y="110" fill="#212121" font-size="13" font-weight="700">₹2</text>

    <line x1="16" y1="125" x2="342" y2="125" stroke="#F0F0F0" stroke-width="1"/>

    <text x="16" y="152" fill="#1A1D1E" font-size="15" font-weight="800">To Pay</text>
    <text x="300" y="152" fill="#0F9347" font-size="17" font-weight="800">₹94</text>
  </g>

  <!-- Bottom Checkout Bar -->
  <g id="BottomCheckoutBar" transform="translate(0, 750)">
    <rect width="390" height="94" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <g transform="translate(16, 14)">
      <rect width="358" height="52" rx="16" fill="url(#primaryGrad)"/>
      <text x="24" y="32" fill="#FFFFFF" font-size="16" font-weight="800">₹94</text>
      <text x="64" y="32" fill="#FFFFFF" fill-opacity="0.8" font-size="12">TOTAL</text>
      <text x="230" y="32" fill="#FFFFFF" font-size="15" font-weight="800">PLACE ORDER →</text>
    </g>
  </g>
</svg>
