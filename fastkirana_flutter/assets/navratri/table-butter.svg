<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="butterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="60%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
    <linearGradient id="foilGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <filter id="butterDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#854D0E" flood-opacity="0.2"/>
    </filter>
  </defs>
  <!-- Wooden Plate / Ceramic Surface -->
  <ellipse cx="60" cy="85" rx="50" ry="20" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="2"/>
  <!-- Foil Wrapper Backing -->
  <path d="M22 68 L38 52 L98 52 L82 72 L22 68 Z" fill="url(#foilGrad)"/>
  <!-- 3D Butter Block (Isometric) -->
  <g filter="url(#butterDrop)">
    <!-- Top Face -->
    <path d="M42 42 L82 42 L94 56 L54 56 Z" fill="#FEF08A"/>
    <!-- Left Face -->
    <path d="M42 42 L54 56 L54 78 L42 64 Z" fill="#FACC15"/>
    <!-- Front Face -->
    <path d="M54 56 L94 56 L94 78 L54 78 Z" fill="#EAB308"/>
    <!-- Butter Knife / Curl -->
    <path d="M72 48 C76 46 82 48 84 52" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  </g>
  <!-- Butter Pat Cut Slab in front -->
  <path d="M26 76 L40 76 L46 84 L32 84 Z" fill="#FEF08A" stroke="#EAB308" stroke-width="1.5"/>
</svg>