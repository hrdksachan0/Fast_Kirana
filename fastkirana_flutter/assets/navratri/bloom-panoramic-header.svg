<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4FA3F7" />
      <stop offset="50%" stop-color="#7BBBF9" />
      <stop offset="100%" stop-color="#B2DAFF" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA826" />
      <stop offset="50%" stop-color="#FF7A00" />
      <stop offset="100%" stop-color="#E65100" />
    </linearGradient>
    <linearGradient id="orangePulp" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE0B2" />
      <stop offset="100%" stop-color="#FFB74D" />
    </linearGradient>
    <linearGradient id="pineappleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="dragonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#BE123C" />
    </linearGradient>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84CC16" />
      <stop offset="100%" stop-color="#4D7C0F" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0284C7" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Sky Backdrop -->
  <rect width="400" height="120" fill="url(#skyGrad)" />

  <!-- Soft Atmospheric Clouds -->
  <path d="M-10,35 Q15,20 40,32 Q70,18 95,30 Q120,25 140,38 L140,50 L-10,50 Z" fill="#FFFFFF" opacity="0.3" />
  <path d="M260,25 Q285,15 310,25 Q340,10 365,22 Q390,18 410,30 L410,45 L260,45 Z" fill="#FFFFFF" opacity="0.3" />

  <!-- "bloom" Cloud Typography -->
  <g filter="url(#softShadow)">
    <text x="200" y="52" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Plus Jakarta Sans', sans-serif" 
          font-size="44" 
          font-weight="900" 
          fill="#FFFFFF" 
          letter-spacing="-1.5" 
          text-anchor="middle">bloom</text>
  </g>

  <!-- Skyline Fruits Ridge -->

  <!-- Left: Pineapple Slice -->
  <g transform="translate(10, 52)">
    <!-- Leaves -->
    <path d="M15,10 C10,-10 0,-15 -5,-18 C5,-10 12,2 15,10 Z" fill="#15803D" />
    <path d="M25,8 C25,-12 18,-20 12,-24 C20,-14 24,0 25,8 Z" fill="#16A34A" />
    <path d="M35,10 C40,-10 50,-15 55,-18 C45,-10 38,2 35,10 Z" fill="#22C55E" />
    <!-- Pineapple Slice Semi-Circle -->
    <path d="M-20,68 C0,35 60,35 85,68 Z" fill="url(#pineappleGrad)" stroke="#B45309" stroke-width="2" />
    <circle cx="32" cy="54" r="10" fill="#FEF3C7" opacity="0.7" />
    <!-- Texture ridges -->
    <line x1="0" y1="58" x2="16" y2="46" stroke="#92400E" stroke-width="1.5" opacity="0.5" />
    <line x1="20" y1="44" x2="36" y2="58" stroke="#92400E" stroke-width="1.5" opacity="0.5" />
    <line x1="38" y1="44" x2="54" y2="58" stroke="#92400E" stroke-width="1.5" opacity="0.5" />
    <line x1="56" y1="44" x2="72" y2="58" stroke="#92400E" stroke-width="1.5" opacity="0.5" />
  </g>

  <!-- Center-Left & Center: Large Juicy Orange Slice -->
  <g transform="translate(160, 48)">
    <!-- Outer Rind -->
    <path d="M-55,72 C-55,20 15,20 75,72 Z" fill="url(#orangeGrad)" />
    <!-- White pith line -->
    <path d="M-50,72 C-50,25 10,25 70,72 Z" fill="#FFF7ED" />
    <!-- Pulp Segments -->
    <path d="M-46,72 C-46,28 8,28 66,72 Z" fill="url(#orangePulp)" />
    <!-- Segment Dividers -->
    <line x1="10" y1="32" x2="10" y2="72" stroke="#FFF7ED" stroke-width="2" />
    <line x1="10" y1="32" x2="-20" y2="72" stroke="#FFF7ED" stroke-width="2" />
    <line x1="10" y1="32" x2="-38" y2="66" stroke="#FFF7ED" stroke-width="2" />
    <line x1="10" y1="32" x2="40" y2="72" stroke="#FFF7ED" stroke-width="2" />
    <line x1="10" y1="32" x2="58" y2="66" stroke="#FFF7ED" stroke-width="2" />
  </g>

  <!-- Right: Dragonfruit & Lime Slices -->
  <g transform="translate(290, 52)">
    <!-- Lime Slice -->
    <path d="M-15,68 C-15,38 25,38 45,68 Z" fill="url(#limeGrad)" stroke="#365314" stroke-width="1.5" />
    <path d="M-11,68 C-11,41 21,41 41,68 Z" fill="#ECFCCB" />
    <line x1="15" y1="43" x2="15" y2="68" stroke="#FFFFFF" stroke-width="1.5" />
    <line x1="15" y1="43" x2="-2" y2="68" stroke="#FFFFFF" stroke-width="1.5" />
    <line x1="15" y1="43" x2="32" y2="68" stroke="#FFFFFF" stroke-width="1.5" />

    <!-- Dragonfruit Slice -->
    <path d="M30,68 C40,32 90,32 110,68 Z" fill="url(#dragonGrad)" />
    <path d="M36,68 C45,36 85,36 104,68 Z" fill="#FFFFFF" />
    <!-- Dragonfruit black seeds -->
    <circle cx="58" cy="54" r="1.5" fill="#0F172A" />
    <circle cx="68" cy="48" r="1.5" fill="#0F172A" />
    <circle cx="78" cy="52" r="1.5" fill="#0F172A" />
    <circle cx="64" cy="62" r="1.5" fill="#0F172A" />
    <circle cx="74" cy="60" r="1.5" fill="#0F172A" />
    <circle cx="86" cy="58" r="1.5" fill="#0F172A" />
    <circle cx="50" cy="58" r="1.5" fill="#0F172A" />
  </g>
</svg>
