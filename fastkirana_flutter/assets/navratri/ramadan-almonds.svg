<svg xmlns="http://www.w3.org/2000/svg" width="320" height="200" viewBox="0 0 320 200" fill="none">
  <defs>
    <filter id="nutShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#3A1700" flood-opacity="0.25"/>
    </filter>

    <linearGradient id="dryFruitBowl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="30%" stop-color="#F5B82A"/>
      <stop offset="70%" stop-color="#C27300"/>
      <stop offset="100%" stop-color="#733600"/>
    </linearGradient>

    <!-- Almond Gradients -->
    <radialGradient id="almondGrad1" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="60%" stop-color="#92400E"/>
      <stop offset="100%" stop-color="#451A03"/>
    </radialGradient>

    <!-- Cashew Gradients -->
    <radialGradient id="cashewGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFDF7"/>
      <stop offset="45%" stop-color="#FEF3C7"/>
      <stop offset="85%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#D97706"/>
    </radialGradient>

    <!-- Pistachio Gradients -->
    <radialGradient id="pistaGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#86EFAC"/>
      <stop offset="50%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#15803D"/>
    </radialGradient>
  </defs>

  <!-- Ambient Ground Shadow -->
  <ellipse cx="160" cy="174" rx="95" ry="13" fill="#3A1700" opacity="0.22"/>

  <!-- Hammered Royal Brass Platter / Bowl Body -->
  <g filter="url(#nutShadow)">
    <!-- Base Foot -->
    <path d="M130 166H190C190 170 182 175 160 175C138 175 130 170 130 166Z" fill="url(#dryFruitBowl)"/>
    <ellipse cx="160" cy="166" rx="30" ry="4" fill="#8C4A00"/>

    <!-- Bowl Belly -->
    <path d="M68 116C68 116 86 166 160 166C234 166 252 116 252 116C252 116 216 128 160 128C104 128 68 116 68 116Z" fill="url(#dryFruitBowl)"/>

    <!-- Bowl Engraved Fluting Pattern -->
    <path d="M96 124C108 144 132 156 160 156C188 156 212 144 224 124" stroke="#FFF3C4" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>
    <path d="M112 134C124 146 142 152 160 152C178 152 196 146 208 134" stroke="#FFF3C4" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>

    <!-- Wide Flared Rim -->
    <ellipse cx="160" cy="116" rx="92" ry="17" fill="url(#dryFruitBowl)"/>
    <ellipse cx="160" cy="115" rx="86" ry="13" fill="#78350F"/>
  </g>

  <!-- Overflowing Mound of Rich Dry Fruits (Badam, Kaju, Pista) -->
  <g filter="url(#nutShadow)">
    <!-- Almonds (California Badam) Stacked Behind -->
    <!-- Almond 1 Left -->
    <path d="M96 100C86 86 98 70 114 74C130 78 126 98 110 104C102 107 98 103 96 100Z" fill="url(#almondGrad1)"/>
    <path d="M98 94C104 84 116 80 120 84" stroke="#FDE68A" stroke-width="1" stroke-linecap="round" opacity="0.6"/>

    <!-- Almond 2 Center-Back -->
    <path d="M142 80C134 66 148 50 164 54C180 58 174 78 158 84C150 87 145 84 142 80Z" fill="url(#almondGrad1)"/>
    <path d="M145 74C152 64 164 62 168 66" stroke="#FDE68A" stroke-width="1" stroke-linecap="round" opacity="0.6"/>

    <!-- Almond 3 Right -->
    <path d="M198 98C190 84 204 68 220 72C236 76 230 96 214 102C206 105 201 102 198 98Z" fill="url(#almondGrad1)"/>

    <!-- Crescent Cashew Nuts (Royal Kaju) Stacked Mid & Front -->
    <!-- Cashew 1 (Left Crown) -->
    <path d="M110 114C102 100 110 82 128 80C140 78 148 88 142 98C136 108 126 108 122 102C120 98 122 92 128 92C118 96 112 106 116 114Z" fill="url(#cashewGrad)"/>

    <!-- Cashew 2 (Center Front King Kaju) -->
    <path d="M145 124C136 108 145 88 166 86C180 84 190 95 182 107C176 118 164 118 160 111C157 106 160 100 166 100C154 104 148 115 152 124Z" fill="url(#cashewGrad)"/>

    <!-- Cashew 3 (Right Mid) -->
    <path d="M184 116C176 102 184 84 202 82C214 80 224 90 218 100C212 110 200 110 196 104C194 100 196 94 202 94C192 98 186 108 190 116Z" fill="url(#cashewGrad)"/>

    <!-- Emerald Green Pistachios (Pista) -->
    <!-- Pista 1 -->
    <ellipse cx="132" cy="118" rx="10" ry="6.5" transform="rotate(-30 132 118)" fill="url(#pistaGrad)"/>
    <path d="M124 114C130 118 136 120 142 122" stroke="#FEF08A" stroke-width="1.2" opacity="0.8"/>

    <!-- Pista 2 -->
    <ellipse cx="188" cy="118" rx="10" ry="6.5" transform="rotate(30 188 118)" fill="url(#pistaGrad)"/>
    <path d="M180 122C186 120 192 118 196 114" stroke="#FEF08A" stroke-width="1.2" opacity="0.8"/>

    <!-- Golden Raisins (Kishmish) Glistening Around Edge -->
    <g fill="#F59E0B">
      <ellipse cx="106" cy="120" rx="5.5" ry="3.5" transform="rotate(20 106 120)"/>
      <ellipse cx="160" cy="126" rx="6" ry="3.8" transform="rotate(-10 160 126)"/>
      <ellipse cx="212" cy="120" rx="5.5" ry="3.5" transform="rotate(-25 212 120)"/>
    </g>
    <g fill="#FEF08A" opacity="0.8">
      <circle cx="105" cy="119" r="1.2"/>
      <circle cx="159" cy="125" r="1.3"/>
      <circle cx="211" cy="119" r="1.2"/>
    </g>
  </g>

  <!-- Twinkling Sparkles -->
  <g fill="#FFFDF0">
    <path d="M54 50L56 44L58 50L64 52L58 54L56 60L54 54L48 52Z"/>
    <path d="M266 52L268 46L270 52L276 54L270 56L268 62L266 56L260 54Z"/>
    <circle cx="78" cy="88" r="1.8" fill="#FDE047"/>
    <circle cx="242" cy="92" r="1.8" fill="#FDE047"/>
  </g>
</svg>
