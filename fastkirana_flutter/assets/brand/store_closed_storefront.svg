<svg width="72" height="64" viewBox="0 0 72 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="redAwning" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F87171"/>
      <stop offset="35%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
    <linearGradient id="whiteAwning" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="canopyTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FCA5A5"/>
      <stop offset="50%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <radialGradient id="bushGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#86EFAC"/>
      <stop offset="50%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#15803D"/>
    </radialGradient>
    <linearGradient id="interiorGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FDE047" stop-opacity="0.3"/>
    </linearGradient>
    <radialGradient id="lanternRadial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="60%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="signGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
  </defs>

  <!-- Step Base -->
  <rect x="6" y="54" width="60" height="6" rx="3" fill="#CBD5E1"/>
  <rect x="7" y="53" width="58" height="2" fill="#E2E8F0"/>

  <!-- Spherical Bushes -->
  <circle cx="9" cy="50" r="7" fill="url(#bushGrad)"/>
  <circle cx="8" cy="46" r="6" fill="url(#bushGrad)"/>
  <circle cx="63" cy="50" r="7" fill="url(#bushGrad)"/>
  <circle cx="64" cy="46" r="6" fill="url(#bushGrad)"/>

  <!-- Store Wall Frame -->
  <rect x="13" y="24" width="46" height="31" rx="1" fill="#FFFDFD" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Glass Door Opening -->
  <rect x="18" y="26" width="36" height="28" fill="url(#interiorGlow)"/>
  <rect x="18" y="26" width="36" height="28" stroke="#334155" stroke-width="2"/>
  <line x1="36" y1="26" x2="36" y2="54" stroke="#334155" stroke-width="2"/>

  <!-- Door Handles -->
  <line x1="34" y1="38" x2="34" y2="44" stroke="#64748B" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="38" y1="38" x2="38" y2="44" stroke="#64748B" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Lanterns on Wall -->
  <circle cx="15.5" cy="31" r="5" fill="url(#lanternRadial)"/>
  <rect x="14" y="29" width="3" height="4.5" rx="1.5" fill="#F59E0B" stroke="#B45309" stroke-width="0.8"/>
  <circle cx="56.5" cy="31" r="5" fill="url(#lanternRadial)"/>
  <rect x="55" y="29" width="3" height="4.5" rx="1.5" fill="#F59E0B" stroke="#B45309" stroke-width="0.8"/>

  <!-- Top Roof Ridge -->
  <rect x="7" y="10" width="58" height="5" rx="2.5" fill="url(#canopyTop)"/>

  <!-- 3D Awning Stripes -->
  <path d="M7 14L9 25H16L14 14H7Z" fill="url(#redAwning)"/>
  <path d="M14 14L16 25H23L22 14H14Z" fill="url(#whiteAwning)"/>
  <path d="M22 14L23 25H30L30 14H22Z" fill="url(#redAwning)"/>
  <path d="M30 14L30 25H37L37 14H30Z" fill="url(#whiteAwning)"/>
  <path d="M37 14L37 25H44L43 14H37Z" fill="url(#redAwning)"/>
  <path d="M43 14L44 25H51L49 14H43Z" fill="url(#whiteAwning)"/>
  <path d="M49 14L51 25H58L56 14H49Z" fill="url(#redAwning)"/>

  <!-- Scalloped Bottom Drops -->
  <circle cx="12.5" cy="25" r="3.5" fill="url(#redAwning)"/>
  <circle cx="19.5" cy="25" r="3.5" fill="url(#whiteAwning)"/>
  <circle cx="26.5" cy="25" r="3.5" fill="url(#redAwning)"/>
  <circle cx="33.5" cy="25" r="3.5" fill="url(#whiteAwning)"/>
  <circle cx="40.5" cy="25" r="3.5" fill="url(#redAwning)"/>
  <circle cx="47.5" cy="25" r="3.5" fill="url(#whiteAwning)"/>
  <circle cx="54.5" cy="25" r="3.5" fill="url(#redAwning)"/>

  <!-- Hanging Closed Sign -->
  <line x1="29" y1="34" x2="36" y2="28" stroke="#F59E0B" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="43" y1="34" x2="36" y2="28" stroke="#F59E0B" stroke-width="1.3" stroke-linecap="round"/>
  <circle cx="36" cy="28" r="1.6" fill="#D97706"/>
  <rect x="25" y="32" width="22" height="12" rx="3.5" fill="url(#signGrad)" stroke="#FFE4E6" stroke-width="1"/>
  <rect x="26.5" y="33.5" width="19" height="9" rx="2" fill="none" stroke="#FCA5A5" stroke-width="0.7" stroke-dasharray="2 1"/>
  <text x="36" y="40.5" font-size="5.8" font-weight="900" fill="#FFFFFF" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" letter-spacing="0.4px">CLOSED</text>
</svg>
