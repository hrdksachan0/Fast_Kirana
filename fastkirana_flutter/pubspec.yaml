name: fastkirana_flutter
description: "Fastkirana 10-Minute Grocery Delivery Mobile App connected to FastAPI Backend"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  provider: ^6.1.2
  google_fonts: ^6.1.0
  flutter_secure_storage: ^9.0.0
  web_socket_channel: ^2.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
