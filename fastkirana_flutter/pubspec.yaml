name: fastkirana_flutter
description: FastKirana Mobile App - Grocery & Food Delivery

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management & Models
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.2
  freezed_annotation: ^2.4.4

  # Navigation
  go_router: ^13.0.1

  # Networking
  dio: ^5.4.3+1
  json_annotation: ^4.8.1

  # Local Storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.0.0

  # Auth
  google_sign_in: ^6.2.1

  # UI & Animations
  animations: ^2.0.11
  google_fonts: 6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  flutter_animate: ^4.5.0
  lucide_icons: ^0.257.0
  action_slider: ^0.7.0
  smooth_page_indicator: ^1.2.0
  lottie: ^3.1.2
  shimmer: ^3.0.0
  flutter_staggered_animations: ^1.1.1
  badges: ^3.1.2
  confetti: ^0.8.0
  flutter_bounceable: ^1.1.0
  dotted_border: ^2.1.0
  flutter_staggered_grid_view: ^0.7.0

  # Systematic UI & Design Tokens
  gap: ^3.0.1
  flutter_gutter: ^2.2.0
  shadcn_ui: ^0.52.3
  forui: ^0.9.0
  mix: ^2.1.0

  # Payments
  razorpay_flutter: ^1.3.7

  # Printing & POS Thermal KOT
  printing: 5.12.0
  pdf: 3.10.8

  # Utils
  intl: ^0.20.2
  url_launcher: ^6.2.5
  geolocator: ^10.1.0
  geocoding: ^3.0.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  connectivity_plus: ^6.0.5
  share_plus: ^10.0.0
  audioplayers: ^6.0.0
  permission_handler: ^11.3.1

  # Maps & Realtime Location
  google_maps_flutter: ^2.5.3
  supabase_flutter: ^2.3.4

  # Notifications
  flutter_local_notifications: ^17.1.2
  firebase_core: ^2.27.0
  firebase_messaging: ^14.7.15
  firebase_crashlytics: 3.5.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  build_runner: ^2.4.9
  json_serializable: ^6.7.4
  freezed: ^2.5.2

dependency_overrides:
  google_fonts: 6.3.3

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/categories/
    - assets/fonts/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: Roboto Mono
      fonts:
        - asset: assets/fonts/RobotoMono-Variable.ttf