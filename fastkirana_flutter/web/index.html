<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="theme-color" content="#047857">
  <meta name="description" content="FastKirana - Fast Delivery | Shop Grocery, Snacks, Fresh Vegetables & More">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="fastkirana_flutter">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>FastKirana - Fast Delivery</title>
  <link rel="manifest" href="manifest.json">

  <!-- Google Maps JS API (required for google_maps_flutter on web) -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBA-OzFRbcw89zAZeELDWOiRl_Ce0uQYrc&libraries=places"></script>

  <!-- Razorpay Web Checkout SDK -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script>
    window.openRazorpayWeb = function(optionsStr) {
      function launch() {
        try {
          var opt = typeof optionsStr === 'string' ? JSON.parse(optionsStr) : optionsStr;
          opt.handler = function(response) {
            if (window.onRazorpaySuccess) {
              window.onRazorpaySuccess(response.razorpay_payment_id, response.razorpay_order_id, response.razorpay_signature);
            }
          };
          opt.modal = {
            ondismiss: function() {
              if (window.onRazorpayDismiss) {
                window.onRazorpayDismiss("Payment window closed by user");
              }
            }
          };
          var rzp = new Razorpay(opt);
          rzp.on('payment.failed', function (response){
            if (window.onRazorpayDismiss) {
              window.onRazorpayDismiss(response.error ? response.error.description : "Payment failed");
            }
          });
          rzp.open();
        } catch (err) {
          console.error("Razorpay instance error:", err);
          if (window.onRazorpayDismiss) {
            window.onRazorpayDismiss(err.message || err.toString());
          }
        }
      }

      if (typeof Razorpay === 'undefined') {
        var script = document.createElement('script');
        script.src = 'https://checkout.razorpay.com/v1/checkout.js';
        script.onload = launch;
        script.onerror = function() {
          if (window.onRazorpayDismiss) {
            window.onRazorpayDismiss("Could not load Razorpay SDK. Please check internet connection.");
          }
        };
        document.head.appendChild(script);
      } else {
        launch();
      }
    };
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
