# FastKirana Release Signing Configuration

# ──────────────────────────────────────────────
# STEP 1: Generate a keystore (one-time)
# ──────────────────────────────────────────────
# Run this PowerShell command (as Administrator):
#
#   cd $env:USERPROFILE\.android
#   keytool -genkeypair -v -storetype PKCS12 -keystore fastkirana_release.keystore `
#     -alias fastkirana -keyalg RSA -keysize 2048 -validity 10000 `
#     -storepass YOUR_STORE_PASSWORD -keypass YOUR_KEY_PASSWORD `
#     -dname "CN=FastKirana, OU=App, O=FastKirana, L=Kanpur, S=UP, C=IN"
#
# ──────────────────────────────────────────────
# STEP 2: Copy keystore to this folder
# ──────────────────────────────────────────────
# Copy fastkirana_release.keystore into android/app/
#
# ──────────────────────────────────────────────
# STEP 3: Fill in the values below
# ──────────────────────────────────────────────
storeFile=fastkirana_release.keystore
storePassword=YOUR_STORE_PASSWORD
keyAlias=fastkirana
keyPassword=YOUR_KEY_PASSWORD
